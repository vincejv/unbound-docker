name: Build and push

on:
  push:
    branches: ["testing"]

env:
  IMAGE: vincejv/unbound

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          # ===== GENERIC =====
          - platforms: linux/arm64,linux/arm/v6,linux/arm/v7,linux/386
            march: ""
            variant: full

          - platforms: linux/arm64,linux/arm/v6,linux/arm/v7,linux/386
            march: ""
            variant: slim

          # ===== X86 OPTIMIZED =====
          - platforms: linux/amd64
            march: sandybridge
            variant: full

          - platforms: linux/amd64
            march: sandybridge
            variant: slim

          - platforms: linux/amd64
            march: skylake
            variant: full

          - platforms: linux/amd64
            march: skylake
            variant: slim

          - platforms: linux/amd64
            march: x86-64
            variant: full

          - platforms: linux/amd64
            march: x86-64
            variant: slim

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🧠 Compute tag
      - name: Compute tag
        id: tag
        run: |
          TAG="testing"

          if [ "${{ matrix.march }}" != "" ]; then
            TAG="$TAG-${{ matrix.march }}"
          fi

          if [ "${{ matrix.variant }}" = "slim" ]; then
            TAG="$TAG-slim"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # 🚀 Build + push (this already creates manifest)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant == 'slim' && 'Dockerfile.slim' || 'Dockerfile' }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            MARCH=${{ matrix.march }}